name: Snapshot

on:
  push:
    tags:
      - "v*"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build snapshot
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}

          BIN=lea-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}

          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN="${BIN}.exe"
          fi

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags="-X main.version=${VERSION}" \
            -o dist/$BIN ./cmd/lea

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
