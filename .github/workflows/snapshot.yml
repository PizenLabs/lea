name: Snapshot

on:
  push:
    tags:
      - "v*"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build snapshot
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist

          go build \
            -ldflags="-X main.version=${VERSION}" \
            -o dist/lea \
            ./cmd/lea

      - uses: actions/upload-artifact@v4
        with:
          name: lea-${{ github.ref_name }}
          path: dist/*
